name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      HAS_MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Reflex-Windows
            platform: windows
            build_args: --x64
          - os: macos-latest
            artifact: Reflex-macOS
            platform: macos
            build_args: ''
          - os: ubuntu-latest
            artifact: Reflex-Linux-x64
            platform: linux
            build_args: --x64
          - os: ubuntu-24.04-arm
            artifact: Reflex-Linux-arm64
            platform: linux
            build_args: --arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        if: matrix.platform != 'macos'
        run: npm run dist -- --publish never ${{ matrix.build_args }}

      - name: Build signed macOS package
        if: matrix.platform == 'macos' && env.HAS_MAC_CERTIFICATE == 'true'
        run: npm run dist -- --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build unsigned macOS package
        if: matrix.platform == 'macos' && env.HAS_MAC_CERTIFICATE != 'true'
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release-new/*.exe
            release-new/*.exe.blockmap
            release-new/*.zip
            release-new/latest.yml
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release-new/*.dmg
            release-new/*.dmg.blockmap
            release-new/*.zip
            release-new/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release-new/*.AppImage
            release-new/*.tar.gz
            release-new/latest-linux*.yml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged applications
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release and updater metadata
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
